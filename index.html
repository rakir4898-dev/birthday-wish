<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="A simple interactive birthday wish for your loved ones">
    <title>Birthday Wish</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sparkles" aria-hidden="true"></div>
    
    <div class="app">
        <div class="progress" id="progress" role="progressbar" aria-valuenow="1" aria-valuemin="1" aria-valuemax="0"></div>
        
        <header class="top">
            <div class="profile">
                <div class="avatar" aria-hidden="true">🎂</div>
                <div class="profile-text">
                    <strong>A birthday note</strong>
                    <span>Made with love</span>
                </div>
            </div>
            <div class="counter" id="counter">1 / 0</div>
        </header>

        <section class="stage" id="stage" aria-live="polite" aria-label="Birthday message display">
            <div class="tap-zone" aria-label="Tap left to go back, tap right to continue">
                <span id="backZone" title="Previous slide"></span>
                <span id="nextZone" title="Next slide"></span>
            </div>
            <article class="slide animate-enter" id="slide">
                <div class="emoji" id="slideEmoji" role="img"></div>
                <h1 id="slideTitle"></h1>
                <p class="message" id="slideMessage"></p>
            </article>
        </section>

        <footer class="footer">
            <p class="hint" id="hint">Tap the right side or use Next to continue</p>
            <div class="controls">
                <button type="button" id="prev" aria-label="Previous slide" disabled>← Back</button>
                <button type="button" id="next" class="primary" aria-label="Next slide">Next →</button>
                <button type="button" id="restart" aria-label="Restart slideshow">↻ Start</button>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
